[package]
name = "csb"
version = "0.2.0"
edition = "2021"
description = "Sandboxed Claude Code on Apple container"
license = "MIT"
repository = "https://github.com/shareefhadid/csb"
readme = "README.md"
keywords = ["claude", "sandbox", "container", "agent", "macos"]
categories = ["command-line-utilities", "development-tools"]
# Ship only what the crate needs to build and document itself.
exclude = ["PLAN.md", ".github/"]

[[bin]]
name = "csb"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
which = "7"
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
