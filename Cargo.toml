[package]
name = "csb"
version = "0.1.0"
edition = "2021"
description = "Sandboxed Claude Code on Apple container"
license = "MIT"
repository = "https://github.com/shareefhadid/csb"

[[bin]]
name = "csb"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
which = "7"
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
